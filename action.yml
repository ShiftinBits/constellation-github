name: "Constellation Index"
description: "Index your codebase with Constellation - intelligent, secure codebase exploration for your AI assistants"
author: "ShiftinBits Inc"

branding:
  icon: "share-2"
  color: "gray-dark"

inputs:
  access-key:
    description: "Constellation access key for authentication"
    required: true
  error-reporting:
    description: "Enable error reporting to Constellation in the event of indexing failures."
    required: false
    default: "true"
  skip-diff-check:
    description: "Skip the diff check and always run indexing. Set to 'true' to disable the optimization that skips indexing when no relevant files changed."
    required: false
    default: "false"
  wait:
    description: "Wait for server-side indexing to complete before finishing the job. Defaults to 'false': the job ends once the upload is accepted, and the server finishes indexing on its own. Set to 'true' if a later step needs the completed index."
    required: false
    default: "false"

outputs:
  indexed:
    description: "Whether the indexing completed successfully"
    value: ${{ steps.index.outputs.indexed || steps.skip.outputs.indexed }}
  summary:
    description: "Summary of the indexing operation"
    value: ${{ steps.index.outputs.summary || steps.skip.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Handle manual trigger
      id: manual_trigger
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        echo "Manual workflow_dispatch trigger detected — forcing full re-index"
        echo "should_index=true" >> "$GITHUB_OUTPUT"

    - name: Ensure full git history
      shell: bash
      run: |
        # Two consumers need history, so this runs for every trigger:
        #   1. diff_check below compares the last indexed commit..HEAD.
        #   2. the CLI diffs against the last *indexed* commit to decide whether
        #      it can send an incremental index. Without that commit it falls
        #      back to a full index, which rewrites the whole project generation
        #      and leaves the reaper to reclaim it.
        # A shallow clone (actions/checkout default fetch-depth: 1) lacks both
        # bases. Unshallow so they resolve. Best-effort: never fail.
        if [[ "$(git rev-parse --is-shallow-repository 2>/dev/null)" == "true" ]]; then
          echo "Shallow clone detected — fetching full history for diff detection"
          if git fetch --unshallow --quiet 2>/dev/null; then
            echo "Full history fetched"
          else
            echo "::warning::Could not unshallow repository (credentials disabled or network issue). Diff-check and incremental indexing will fall back to a full index. For best results, set 'fetch-depth: 0' on actions/checkout."
          fi
        else
          echo "Full history already present — skipping unshallow"
        fi

    - name: Check for relevant changes
      id: diff_check
      if: github.event_name != 'workflow_dispatch'
      shell: bash
      env:
        SKIP_DIFF_CHECK: ${{ inputs.skip-diff-check }}
        CONSTELLATION_ACCESS_KEY: ${{ inputs.access-key }}
      run: |
        # If skip-diff-check is enabled, always index
        if [[ "$SKIP_DIFF_CHECK" == "true" ]]; then
          echo "Diff check skipped — skip-diff-check is enabled"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Verify constellation.json exists
        if [[ ! -f "constellation.json" ]]; then
          echo "::error::constellation.json not found in repository root. This file is required for Constellation indexing."
          exit 1
        fi

        # Extract file extensions from constellation.json
        EXTENSIONS=$(jq -r '.languages | to_entries[].value.fileExtensions[]' constellation.json 2>/dev/null)
        if [[ -z "$EXTENSIONS" ]]; then
          echo "::warning::No file extensions configured in constellation.json — skipping indexing"
          echo "should_index=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Extract exclude patterns (may be empty)
        EXCLUDES=$(jq -r '.exclude[]? // empty' constellation.json 2>/dev/null)

        # The baseline is the last commit the server indexed for this branch,
        # not github.event.before. A push's previous tip says nothing about
        # whether that tip was ever indexed: a never-indexed project, or an
        # earlier run that skipped or failed, would otherwise stay stale until
        # some later push happened to touch a source file. This mirrors the
        # CLI's own scope decision. Any doubt fails open toward indexing; the
        # CLI makes the final call.
        PROJECT_ID=$(jq -r '.projectId // empty' constellation.json 2>/dev/null)
        BRANCH=$(jq -r '.branch // empty' constellation.json 2>/dev/null)
        if [[ -z "$PROJECT_ID" || -z "$BRANCH" ]]; then
          echo "projectId or branch missing from constellation.json — indexing so the CLI can report it"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        STATE_FILE=$(mktemp)
        trap 'rm -f "$STATE_FILE"' EXIT
        if ! HTTP_STATUS=$(curl -sS --max-time 30 -o "$STATE_FILE" -w '%{http_code}' \
            -H "Authorization: Bearer $CONSTELLATION_ACCESS_KEY" \
            -H "x-project-id: $PROJECT_ID" \
            -H "x-branch-name: $BRANCH" \
            "${CONSTELLATION_API_URL:-https://api.constellationdev.io}/intel/v1/project"); then
          echo "::warning::Could not reach the Constellation API to read project state — indexing"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ "$HTTP_STATUS" != "200" ]]; then
          # 404 means this branch has never been indexed
          echo "Project state request returned HTTP $HTTP_STATUS — indexing"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ "$(jq -r '.requiresFullIndex // false' "$STATE_FILE" 2>/dev/null)" != "false" ]]; then
          echo "Server requires a full index for this branch — indexing"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        LATEST_COMMIT=$(jq -r '.latestCommit // empty' "$STATE_FILE" 2>/dev/null)
        if [[ ! "$LATEST_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
          echo "No indexed commit recorded for this branch — indexing"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "Last indexed commit: $LATEST_COMMIT"

        # Get changed files since the last indexed commit
        if ! CHANGED_FILES=$(git diff --name-only "$LATEST_COMMIT" HEAD 2>/dev/null); then
          echo "::warning::git diff failed (last indexed commit missing from local history: shallow clone or force-push) — indexing"
          echo "should_index=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [[ -z "$CHANGED_FILES" ]]; then
          echo "No files changed — skipping indexing"
          echo "should_index=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Check if any changed file matches a configured extension and is not excluded
        is_excluded() {
          local file="$1"
          if [[ -z "$EXCLUDES" ]]; then
            return 1
          fi
          while IFS= read -r pattern; do
            [[ -z "$pattern" ]] && continue
            # Handle dir/** patterns as prefix match
            local prefix="${pattern%%/\*\*}"
            if [[ "$prefix" != "$pattern" && "$file" == "$prefix"/* ]]; then
              return 0
            fi
            # Handle **/ prefix patterns
            local suffix="${pattern##\*\*/}"
            if [[ "$suffix" != "$pattern" && ( "$file" == */$suffix || "$file" == $suffix ) ]]; then
              return 0
            fi
            # Direct glob match
            if [[ "$file" == $pattern ]]; then
              return 0
            fi
          done <<< "$EXCLUDES"
          return 1
        }

        SHOULD_INDEX="false"
        while IFS= read -r file; do
          [[ -z "$file" ]] && continue
          # Check if file extension matches any configured extension
          file_ext=".${file##*.}"
          while IFS= read -r ext; do
            [[ -z "$ext" ]] && continue
            if [[ "$file_ext" == "$ext" ]]; then
              # Extension matches — check if excluded
              if ! is_excluded "$file"; then
                echo "Relevant change detected: $file"
                SHOULD_INDEX="true"
                break 2
              fi
            fi
          done <<< "$EXTENSIONS"
        done <<< "$CHANGED_FILES"

        if [[ "$SHOULD_INDEX" == "true" ]]; then
          echo "Relevant files changed — indexing will proceed"
        else
          echo "No relevant files changed — skipping indexing"
        fi
        echo "should_index=$SHOULD_INDEX" >> "$GITHUB_OUTPUT"

    - name: Setup Node.js
      if: steps.manual_trigger.outputs.should_index == 'true' || steps.diff_check.outputs.should_index == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: "24"

    - name: Install Constellation CLI
      if: steps.manual_trigger.outputs.should_index == 'true' || steps.diff_check.outputs.should_index == 'true'
      shell: bash
      run: npm install -g @constellationdev/cli@latest --silent --no-fund --no-audit 2>/dev/null

    - name: Install LSP servers for enrichment
      if: steps.manual_trigger.outputs.should_index == 'true' || steps.diff_check.outputs.should_index == 'true'
      shell: bash
      run: npm install -g typescript-language-server typescript pyright --silent --no-fund --no-audit 2>/dev/null

    - name: Run Constellation Index
      id: index
      if: steps.manual_trigger.outputs.should_index == 'true' || steps.diff_check.outputs.should_index == 'true'
      shell: bash
      env:
        CONSTELLATION_ACCESS_KEY: ${{ inputs.access-key }}
        CONSTELLATION_ERROR_REPORTING: ${{ inputs.error-reporting }}
        MANUAL_TRIGGER: ${{ steps.manual_trigger.outputs.should_index }}
        WAIT_FOR_SERVER: ${{ inputs.wait }}
      run: |
        echo "::group::Constellation Index"
        # workflow_dispatch is the operator's escape hatch for forcing a clean
        # rebuild, so it must pass --full explicitly. It used to get one only as
        # a side effect of the CLI defaulting every CI run to a full index; now
        # that CI indexes incrementally, an unflagged run here would quietly do
        # the opposite of what the manual-trigger step announces.
        INDEX_ARGS=()
        if [[ "$MANUAL_TRIGGER" == "true" ]]; then
          echo "Manual trigger — forcing a full re-index"
          INDEX_ARGS+=(--full)
        fi
        # The CLI waits for server-side indexing on incremental runs by
        # default; in CI that just spends runner minutes polling, and the
        # server validates incremental claims itself. Opt out unless the
        # workflow asked to wait.
        if [[ "$WAIT_FOR_SERVER" == "true" ]]; then
          INDEX_ARGS+=(--wait)
        else
          INDEX_ARGS+=(--no-wait)
        fi
        if constellation index "${INDEX_ARGS[@]}"; then
          echo "indexed=true" >> "$GITHUB_OUTPUT"
          echo "summary=Indexing completed successfully" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
        else
          echo "indexed=false" >> "$GITHUB_OUTPUT"
          echo "summary=Indexing failed" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"
          exit 1
        fi

    - name: Set skip output
      id: skip
      if: success() && steps.manual_trigger.outputs.should_index != 'true' && steps.diff_check.outputs.should_index != 'true'
      shell: bash
      run: |
        echo "indexed=false" >> "$GITHUB_OUTPUT"
        echo "summary=No relevant files changed — indexing skipped" >> "$GITHUB_OUTPUT"
